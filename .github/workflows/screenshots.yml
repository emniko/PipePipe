name: UI screenshots

# Builds the debug APK, runs it on an emulator and commits screenshots of the main
# screens to the "ci-screenshots" branch, for reviewing the UI without a phone.

on:
  workflow_dispatch:
  push:
    branches:
      - youtube-ui

permissions:
  contents: write

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  screenshots:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: "temurin"
          cache: 'gradle'

      - name: Build debug APK
        run: |
          cd PipePipeClient
          ./gradlew assembleDebug --stacktrace -DskipFormatKtlint

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash .github/scripts/take_screenshots.sh

      - name: Commit screenshots to ci-screenshots branch
        if: always()
        run: |
          [ -d screenshots ] || exit 0
          SHA=$(git rev-parse --short HEAD)
          CLIENT=$(git -C PipePipeClient rev-parse --short HEAD)
          mkdir /tmp/shots && cp -r screenshots/* /tmp/shots/
          cd /tmp/shots
          git init -q -b ci-screenshots
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "Screenshots of PipePipe $SHA (client $CLIENT), run ${{ github.run_id }}" > README.md
          git add -A
          git commit -q -m "Screenshots for $SHA (client $CLIENT)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-screenshots
